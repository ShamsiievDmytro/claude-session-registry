name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: macos-latest   # no 3.9 build for Apple-silicon runners; macOS 3.9 is checked locally
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v test_session_registry
      - name: Hook launcher finds Python and prints nothing
        shell: bash
        run: |
          out=$(echo '{"session_id":"ci"}' | bash hooks/run prompt)
          test -z "$out"
          test -f ~/.claude/session-registry.md
      - name: Registry path used by the Windows open command resolves (PowerShell 5 and 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$HOME\.claude\session-registry.md")) { exit 1 }
          powershell -NoProfile -Command 'if (-not (Test-Path "$HOME\.claude\session-registry.md")) { exit 1 }'
      - name: macOS open command exists
        if: runner.os == 'macOS'
        run: command -v open
